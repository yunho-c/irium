[package]
name = "irium-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "irm"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ratatui-interact = "0.4.2"
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
rig-core = "0.31.0"
kreuzberg = { version = "4.4.1", features = ["pdf", "bundled-pdfium", "excel", "office", "archives"] }
hayro = "0.5.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
tachyonfx = "0.25.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
